name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org,direct

jobs:
  check:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download sub-module dependencies
        run: |
          for mod in $(find . -mindepth 2 -name go.mod -printf '%h\n' | sort); do
            (cd "$mod" && go mod download)
          done

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          install-mode: binary
          args: --version

      - name: make check
        run: make check

  fuzz:
    name: fuzz (60s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: make fuzz FUZZTIME=60s
        run: make fuzz FUZZTIME=60s

      - name: upload fuzz failures (if any)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ github.sha }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  bench:
    name: bench (no gate)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download sub-module dependencies
        run: |
          for mod in $(find . -mindepth 2 -name go.mod -printf '%h\n' | sort); do
            (cd "$mod" && go mod download)
          done

      - name: make bench
        run: make bench | tee bench.txt

      - name: upload bench output
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.sha }}
          path: bench.txt
          if-no-files-found: ignore
