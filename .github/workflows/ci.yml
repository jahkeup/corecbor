name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          # We run it ourselves via `make lint` so the local + CI
          # behavior matches. The action is installed only.
          install-mode: binary
          args: --version

      - name: make check
        run: make check

  fuzz:
    name: fuzz (60s per target)
    runs-on: ubuntu-latest
    # Phase 1 registers the fuzz catalog with empty seed corpora;
    # CI runs each registered target for 60s on every push to main
    # and every PR. Failures lock new corpus entries into testdata/fuzz/
    # which the next run picks up.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make fuzz FUZZTIME=60s
        run: make fuzz FUZZTIME=60s

      - name: upload fuzz failures (if any)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ github.sha }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore

  bench:
    name: bench (no gate)
    runs-on: ubuntu-latest
    # Per encoder-decoder-spec §10 Phase 1: benches MUST exist and
    # produce numbers, but their numbers are NOT gating in Phase 1.
    # This job runs them to surface drift in PR-comment form via
    # follow-up tooling; it does not block merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make bench
        run: make bench | tee bench.txt

      - name: upload bench output
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: bench.txt
          if-no-files-found: ignore
